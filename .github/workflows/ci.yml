name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  test-web:
    name: Web Tests (deenquest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: deenquest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: deenquest/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test -- --no-coverage

  test-mobile:
    name: Mobile Tests (deenQuestApplication)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: deenQuestApplication
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: deenQuestApplication/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test -- --no-coverage
